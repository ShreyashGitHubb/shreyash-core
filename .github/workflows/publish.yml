name: Publish to npm

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Select next package version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import fs from 'node:fs';

          const currentVersion = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          let publishedVersion = '0.0.0';
          try {
            publishedVersion = execFileSync('npm', ['view', 'shreyash-core@latest', 'version'], { encoding: 'utf8' }).trim();
          } catch {
            // The package may not have a published release yet.
          }

          const current = currentVersion.split('.').map(Number);
          const published = publishedVersion.split('.').map(Number);
          const currentIsNewer = current.some((value, index) => {
            for (let previous = 0; previous < index; previous += 1) {
              if (current[previous] !== published[previous]) return false;
            }
            return value > published[index];
          });
          const nextVersion = currentIsNewer
            ? currentVersion
            : `${published[0]}.${published[1]}.${published[2] + 1}`;

          if (nextVersion !== currentVersion) {
            execFileSync('npm', ['version', nextVersion, '--no-git-tag-version'], { stdio: 'inherit' });
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${nextVersion}\n`);
          NODE

      - name: Publish package with provenance
        run: npm publish --provenance --access public

      - name: Commit released version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release shreyash-core@${{ steps.version.outputs.version }} [skip ci]"
            git push
          fi